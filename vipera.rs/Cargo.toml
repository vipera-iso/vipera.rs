[workspace]
resolver = "3"
members = [
    "crates/vipera-errors",
    "crates/vipera-traits",
    "crates/vipera-conformance",
    "crates/vipera-tokenizer",
    "crates/vipera-sampler",
    "crates/vipera-runtime",
    "crates/vipera-backend-cpu",
    "crates/vipera-core",
    "bins/vipera",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
vipera-errors = { path = "crates/vipera-errors" }
vipera-traits = { path = "crates/vipera-traits" }
vipera-conformance = { path = "crates/vipera-conformance" }
vipera-tokenizer = { path = "crates/vipera-tokenizer" }
vipera-sampler = { path = "crates/vipera-sampler" }
vipera-runtime = { path = "crates/vipera-runtime" }
vipera-backend-cpu = { path = "crates/vipera-backend-cpu" }
vipera-core = { path = "crates/vipera-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
