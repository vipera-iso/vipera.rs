name: ci

# The gate this repository actually holds: format, lint, test, in that order, on every push and pull
# request.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The integration tests skip themselves with a printed reason when no model is present; this
      # keeps that reason visible in the job log instead of buried in a captured test harness.
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain components
        run: rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        # `acme` is off by default, so it is named here: code the default build never compiles is
        # code the gate never checks.
        run: cargo clippy --workspace --all-targets --locked --features acme -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Test the ACME feature
        run: cargo test -p vipera-server --features acme --locked

      - name: Test the release-mode measurements
        # These assert, so they belong in the gate; they are `#[ignore]`d only because a debug build
        # cannot prefill or time them. Without a model they print the reason and pass.
        run: cargo test -p vipera-backend-cpu --release --locked --test prefix_cache --test alignment_probe -- --ignored
