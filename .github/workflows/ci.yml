name: ci

# One gate, run per stage, in parallel. The stages themselves live in `scripts/gate.sh`, so the
# command CI runs and the command a human runs are the same command; this file only decides where
# they run, what they may reuse, and how a red build is reported.
#
# Adding a check means adding a stage to the script and a name to the matrix. It does not mean
# writing a second command here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The integration tests skip themselves with a printed reason when no model is present; this keeps
  # that reason visible in the job log instead of buried in a captured harness.
  RUST_BACKTRACE: "1"

jobs:
  gate:
    name: gate / ${{ matrix.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Every stage reports, so one red does not hide the other six.
      fail-fast: false
      matrix:
        stage: [fmt, lint, build, test, features, measure, gpu]
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain components
        run: rustup component add rustfmt clippy

      - name: Toolchain
        # The pin is `rust-toolchain.toml`; print what it resolved to, so a green report carries the
        # compiler it ran on rather than "stable, at the time".
        run: |
          rustc --version --verbose
          cargo --version

      # The pinned toolchain decides the build and `Cargo.lock` decides the graph, so the key carries
      # both: a restore can only be a restore for the same pair. Per stage, because each stage builds
      # a different feature set, with a shared fallback for a cold stage.
      - name: Cache cargo and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.stage }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.stage }}-
            ${{ runner.os }}-cargo-

      - name: ${{ matrix.stage }}
        run: ./scripts/gate.sh ${{ matrix.stage }}

  skills:
    # A perf change must name the skills it loaded, per phase (`vipera-perf-loop` §2). A line in a
    # chat transcript is not evidence anyone can check later; the PR body is, and GitHub hands it to
    # the runner. Body text is only available from the event, so this cannot be a `gate.sh` stage.
    name: skills
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: PR body names the skills it loaded
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -qiE '^##[[:space:]]+skills[[:space:]]*$'; then
            echo "found a '## Skills' section"
            exit 0
          fi
          echo "::error::this PR body has no '## Skills' section (vipera-perf-loop §2)."
          echo "Add one line naming the phases it used, for example:"
          echo '  `1 optimizer` · `3 ponytail` · `6 green-push`'
          echo "Phases 1, 3 and 6 are mandatory; say so in the section if one does not apply."
          exit 1

  ci:
    # The one check to require in branch protection, and the one place that says which stage was red.
    # The matrix reports each stage; this fails unless all of them passed.
    name: ci
    if: always()
    needs: [gate, skills]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every stage passed
        run: |
          echo "gate: ${{ needs.gate.result }}"
          echo "skills: ${{ needs.skills.result }}"
          test "${{ needs.gate.result }}" = success
          # `skills` is skipped on a push to main, where there is no PR body to read.
          case "${{ needs.skills.result }}" in
            success | skipped) ;;
            *)
              echo "::error::the skills job did not pass"
              exit 1
              ;;
          esac
