name: ci

# The gate this repository actually holds: format, lint, test, in that order, on every push and pull
# request. It runs from `vipera.rs/` because the workspace lives one level below the repository root,
# next to the specifications.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vipera.rs
    env:
      # The integration tests skip themselves with a printed reason when no model is present; this
      # keeps that reason visible in the job log instead of buried in a captured test harness.
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain components
        run: rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
