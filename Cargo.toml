[workspace]
resolver = "3"
members = [
    "crates/vipera-errors",
    "crates/vipera-traits",
    "crates/vipera-conformance",
    "crates/vipera-tokenizer",
    "crates/vipera-sampler",
    "crates/vipera-runtime",
    "crates/vipera-backend-cpu",
    "crates/vipera-backend-gpu",
    "crates/vipera-core",
    "crates/vipera-algo-keepkv",
    "crates/vipera-server",
    "bins/vipera",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
vipera-errors = { path = "crates/vipera-errors" }
vipera-traits = { path = "crates/vipera-traits" }
vipera-conformance = { path = "crates/vipera-conformance" }
vipera-tokenizer = { path = "crates/vipera-tokenizer" }
vipera-sampler = { path = "crates/vipera-sampler" }
vipera-runtime = { path = "crates/vipera-runtime" }
vipera-backend-cpu = { path = "crates/vipera-backend-cpu" }
vipera-backend-gpu = { path = "crates/vipera-backend-gpu" }
vipera-server = { path = "crates/vipera-server" }
vipera-core = { path = "crates/vipera-core" }
# TLS for `vipera serve`. `ring` keeps the provider to one audited C-free-API backend and
# `std`/`tls12` are what a server needs; nothing else in the workspace takes a third-party crate.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# ACME provisioning for `vipera serve` behind the `acme` feature (EXC-003, default off).
# `ring` keeps the provider to the one rustls already links; `rcgen` is what the client's
# `finalize()` uses to build the CSR and the certificate key.
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "rcgen", "ring"] }
tokio = { version = "1", default-features = false, features = ["rt", "time", "net", "io-util"] }
serde_json = "1"
# Read-only mapping of a model file (EXC-005). The weights are served straight from the page
# cache and the layers nobody asked for stay on disk, which a heap `Vec<u8>` cannot do.
memmap2 = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
